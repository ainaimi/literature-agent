[project]
name = "literature-agent"
version = "0.1.0"
description = "Weekly literature surveillance: search, LLM-score, and email a digest"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.96.0",
    "openai>=2.32.0",
    "pypdf>=6.10.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "requests>=2.33.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
